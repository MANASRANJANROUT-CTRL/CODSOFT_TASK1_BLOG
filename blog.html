<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>InkSpace - Article</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="container nav-container">

            <a
                href="index.html"
                class="logo"
            >
                InkSpace
            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="index.html#articles">
                    Articles
                </a>

                <a href="index.html#categories">
                    Categories
                </a>

                <a href="index.html#about">
                    About
                </a>

            </nav>


            <button
                id="theme-toggle"
                class="theme-toggle"
                aria-label="Toggle dark mode"
            >
                🌙
            </button>


            <button
                id="menu-toggle"
                class="menu-toggle"
                aria-label="Open menu"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- =========================
         ARTICLE
    ========================== -->

    <main>

        <article class="article-page">

            <div class="container article-container">

                <!-- Article Header -->

                <header class="article-header">

                    <span
                        id="article-category"
                        class="category"
                    >
                        Technology
                    </span>


                    <h1 id="article-title">
                        Loading article...
                    </h1>


                    <p
                        id="article-excerpt"
                        class="article-excerpt"
                    >
                    </p>


                    <div class="article-meta">

                        <span id="article-date">
                        </span>

                        <span>•</span>

                        <span id="reading-time">
                            5 min read
                        </span>

                    </div>

                </header>


                <!-- Article Image -->

                <div class="article-cover">

                    <img
                        id="article-image"
                        src=""
                        alt=""
                    >

                </div>


                <!-- Article Content -->

                <div
                    id="article-content"
                    class="article-content"
                >
                </div>


                <!-- Tags -->

                <div class="article-tags">

                    <h3>
                        Tags
                    </h3>

                    <div
                        id="article-tags"
                        class="tags-list"
                    >
                    </div>

                </div>


                <!-- Share -->

                <div class="share-section">

                    <h3>
                        Share this article
                    </h3>

                    <div class="share-buttons">

                        <button
                            id="share-linkedin"
                            class="share-btn"
                        >
                            LinkedIn
                        </button>

                        <button
                            id="share-x"
                            class="share-btn"
                        >
                            X
                        </button>

                        <button
                            id="copy-link"
                            class="share-btn"
                        >
                            Copy Link
                        </button>

                    </div>

                </div>


                <!-- Related Articles -->

                <section class="related-section">

                    <div class="section-heading">

                        <p class="section-label">
                            KEEP READING
                        </p>

                        <h2>
                            Related Articles
                        </h2>

                    </div>


                    <div
                        id="related-posts"
                        class="posts-grid"
                    >
                    </div>

                </section>


                <!-- Comments -->

                <section class="comments-section">

                    <div class="section-heading">

                        <p class="section-label">
                            COMMUNITY
                        </p>

                        <h2>
                            Comments
                        </h2>

                    </div>


                    <form id="comment-form">

                        <input
                            type="text"
                            id="comment-name"
                            placeholder="Your name"
                            required
                        >


                        <textarea
                            id="comment-text"
                            placeholder="Write a comment..."
                            rows="5"
                            required
                        ></textarea>


                        <button
                            type="submit"
                            class="comment-submit"
                        >
                            Post Comment
                        </button>

                    </form>


                    <div
                        id="comments-list"
                        class="comments-list"
                    >
                    </div>

                </section>

            </div>

        </article>

    </main>

    <!-- Comments Section -->
<section class="comments-section">

    <div class="container comments-container">

        <div class="section-heading">
            <p class="section-label">JOIN THE CONVERSATION</p>
            <h2>Comments</h2>
        </div>

        <!-- Comment Form -->
        <form id="comment-form" class="comment-form">

            <div class="form-row">

                <div class="form-group">
                    <label for="comment-name">Name</label>

                    <input
                        type="text"
                        id="comment-name"
                        placeholder="Your name"
                        required
                    >
                </div>

            </div>

            <div class="form-group">

                <label for="comment-text">Comment</label>

                <textarea
                    id="comment-text"
                    rows="5"
                    placeholder="Share your thoughts..."
                    required
                ></textarea>

            </div>

            <button type="submit" class="comment-submit">
                Post Comment
            </button>

        </form>


        <!-- Comments Display -->
        <div class="comments-list" id="comments-list">

            <!-- JavaScript will add comments here -->

        </div>

    </div>

</section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="container footer-content">

            <div>

                <h3>
                    InkSpace
                </h3>

                <p>
                    Stories worth reading.
                </p>

            </div>


            <div>

                <p>
                    © 2026 InkSpace.
                    All rights reserved.
                </p>

            </div>

        </div>

    </footer>


    <script src="js/posts.js"></script>

    <script src="js/script.js"></script>

    <script src="js/blog.js"></script>

</body>

</html>
